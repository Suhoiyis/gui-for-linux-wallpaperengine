[package]
name = "lwg-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# 序列化框架，用于读写 JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 用于获取 Linux 标准配置路径 (如 ~/.config/lwg/)
directories = "5.0"
# 错误处理
thiserror = "1.0"
# 异步运行时 (与 lwg-ui 保持一致)
tokio = { version = "1", features = ["fs"] }
