[workspace]
members = [
    "crates/lwg-core",
    "crates/lwg-ipc",
    "crates/lwg-ui",
    "crates/lwg-tray",
]
resolver = "2"

[workspace.package]
version = "2.0.0-pre.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Suhoiyis"]
repository = "https://github.com/Suhoiyis/gui-for-linux-wallpaperengine"

[workspace.dependencies]
relm4 = "0.9"
relm4-components = "0.9"
gtk4 = "0.9"
libadwaita = "0.7"
gdk4 = "0.9"
gdk-pixbuf = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
sysinfo = "0.33"
image = "0.25"
dirs = "6"
lru = "0.12"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
tempfile = "3"
which = "6"
